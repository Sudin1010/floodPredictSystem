<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v=landing-polish-2">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary app-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <img class="brand-logo" src="{{ url_for('static', path='/images/logo.svg') }}" alt="Flood Prediction System logo">
            <span>Flood Prediction System</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <a class="nav-link text-white" href="/">Home</a>
                {% if current_user %}
                {% if current_user.role == "cdo" %}
                <a class="nav-link text-white" href="/cdo/dashboard">CDO Dashboard</a>
                <a class="nav-link text-white" href="/cdo/predict">Create Prediction</a>
                {% else %}
                <a class="nav-link text-white" href="/predict">Predict</a>
                <a class="nav-link text-white" href="/history">Dashboard</a>
                <a class="nav-link text-white" href="/subscription">Subscription</a>
                {% endif %}
                <a class="nav-link text-white" href="/logout">Logout</a>
                {% else %}
                <a class="nav-link text-white" href="/#features">Features</a>
                <a class="nav-link text-white" href="/#how-it-works">How It Works</a>
                <a class="nav-link text-white nav-link-outline" href="/login">Sign In</a>
                <a class="nav-link text-white nav-link-filled" href="/register">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='/js/script.js') }}"></script>
</body>
</html>
