{% extends "base.html" %}

{% block content %}
<section class="container py-5 dashboard-page">
    <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0">CDO Dashboard</h3>
        </div>
        <div class="card-body p-4">
            <h4 class="mb-3">Welcome, {{ current_user.username }}</h4>
            <p class="mb-2"><strong>Role:</strong> CDO</p>
            <p class="mb-4"><strong>District:</strong> {{ current_user.district or "Not assigned" }}</p>
            <div class="alert alert-success mb-0 shadow-sm" role="alert">
                CDO access verified successfully.
            </div>
        </div>
    </div>
</section>
{% endblock %}
